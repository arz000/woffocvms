{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}My Schedule App{% endblock %}</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <!-- Tailwind CSS v4 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    {% block content %} 
    


    
    {% endblock %}
    <script>
      // Logout Modal Functions
    function openLogoutModal() {
      const modal = document.getElementById("logoutModal");
      modal.classList.remove("hidden");
      modal.classList.add("flex");
    }

    function closeLogoutModal() {
      const modal = document.getElementById("logoutModal");
      modal.classList.add("hidden");
      modal.classList.remove("flex");
    }

    document.getElementById("logoutModal").addEventListener("click", function (e) {
      if (e.target === this) {
        closeLogoutModal();
      }
    });

    // Create Post Modal Functions
    function openCreatePostModal(){
      const modal = document.getElementById("createPostModal");
      modal.classList.remove("hidden");
      modal.classList.add("flex");
    }

    function closeCreatePostModal(){
      const modal = document.getElementById("createPostModal");
      modal.classList.add("hidden");
      modal.classList.remove("flex");
    }

    // Comment Modal Functions
    // Open Modal for a specific post
    function openCommentModal(postId) {
      document.getElementById('commentModal').classList.remove('hidden');
        const commentsHtml =
        document.getElementById(`comments-${postId}`).innerHTML;

        document.getElementById('commentContainer').innerHTML = commentsHtml;
        document.getElementById('commentForm').action =
                    `/comment-post/${postId}/`;
            }

    // Close Modal for a specific post
    function closeCommentModal() {
      const modal = document.getElementById('commentModal');
      if (modal) {
          modal.classList.add('hidden');
          }
        }

    // Close on Escape key press
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            closeCommentModal();
            }
      });
    
    // Fetch API for Comment Form Submission
      document.getElementById('commentForm').addEventListener('submit', async function(e){
          e.preventDefault();

          const form = this;

          const response = await fetch(form.action,{
              method:'POST',
              body:new FormData(form),
              headers:{
                  'X-Requested-With':'XMLHttpRequest'
              }
          });

          const data = await response.json();

          if(data.success){

              const container =
                  document.getElementById('commentContainer');

              container.insertAdjacentHTML(
                  'beforeend',
                  `
                  <div class="bg-stone-800 rounded-xl p-3 mb-2">
                      <p class="text-xs font-bold text-emerald-400">
                          ${data.author}
                      </p>

                      <p class="text-sm text-stone-300">
                          ${data.content}
                      </p>
                  </div>
                  `
              );

              form.querySelector('textarea').value = '';

              const postId =
                  form.action.match(/\d+/)[0];

              const countElement =
                  document.querySelector(
                      `.comment-count[data-post-id="${postId}"]`
                  );

              if(countElement){
                  countElement.textContent =
                      data.comments_count;
              }
          }
      });

    // Fetch API for Like Button
    document.querySelectorAll('.like-form').forEach(form => {
    form.addEventListener('submit', async function(e) {
        e.preventDefault();

        const postId = this.dataset.postId;
        const response = await fetch(
            `/like-post/${postId}/`,
            {
                method: 'POST',
                headers: {
                    'X-CSRFToken': this.querySelector('[name=csrfmiddlewaretoken]').value
                }
            }
        );

        const data = await response.json();

        // 1. Update total count text
        const countSpan = this.querySelector('.like-count');
        countSpan.textContent = data.likes_count;

        // 2. Toggle filled red state vs outline state
        const svg = this.querySelector('.like-svg');

        if (data.liked) {
            // Liked: fill solid red and color stroke red
            svg.classList.add('text-rose-500', 'fill-rose-500');
            svg.classList.remove('text-stone-400', 'fill-none');
            
            countSpan.classList.add('text-rose-400');
            countSpan.classList.remove('text-stone-300');
        } else {
            // Unliked: remove fill and revert to gray outline
            svg.classList.remove('text-rose-500', 'fill-rose-500');
            svg.classList.add('text-stone-400', 'fill-none');
            
            countSpan.classList.remove('text-rose-400');
            countSpan.classList.add('text-stone-300');
          }
        });
      });
    </script>
  </body>
</html>
