<!-- Comment Modal Container -->
<div id="commentModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-stone-950/80 backdrop-blur-md p-4">
    <div class="bg-stone-900 border border-stone-800 w-full max-w-lg rounded-3xl p-6 shadow-2xl relative">
        <div class="flex items-center justify-between pb-4 border-b border-stone-800">
            <h3 class="text-sm font-black text-white uppercase tracking-wider">Comments</h3>
        </div>

        <!-- Scrollable Comments Container -->
        <div id="modalCommentsList" class="my-4 max-h-60 overflow-y-auto space-y-3 pr-2">
            <!-- Populated via JS -->
        </div>

        <!-- Comment Form -->
        <form id="modalCommentForm" method="POST" action="" class="space-y-3" onsubmit="handleCommentSubmit(event)">
            {% csrf_token %}
            <textarea 
                name="content" 
                rows="2" 
                required 
                placeholder="Write a comment..." 
                class="w-full bg-stone-950 border border-stone-800 rounded-xl p-3 text-xs text-stone-200 focus:outline-none focus:border-emerald-500 transition-colors resize-none"
            ></textarea>
            
            <div class="flex justify-end gap-2">
                <button type="button" onclick="closeCommentModal()" class="px-4 py-2 rounded-xl text-xs font-bold text-stone-400 hover:text-white cursor-pointer">Cancel</button>
                <button type="submit" class="px-4 py-2 bg-emerald-500 hover:bg-emerald-400 text-stone-950 text-xs font-black rounded-xl transition-all cursor-pointer">Post Comment</button>
            </div>
        </form>
    </div>
</div>
