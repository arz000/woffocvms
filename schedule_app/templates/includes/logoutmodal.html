<!-- Logout Modal Overlay -->
        <div
            id="logoutModal"
            class="hidden fixed inset-0 bg-stone-950/80 backdrop-blur-sm flex items-center justify-center z-50 p-4 transition-all"
        >
            <div class="bg-stone-900/95 border border-stone-800 rounded-3xl w-full max-w-md p-6 sm:p-8 shadow-2xl relative text-center backdrop-blur-md">
                <button
                    type="button"
                    class="absolute top-4 right-4 w-8 h-8 flex items-center justify-center rounded-full text-stone-400 hover:text-stone-200 hover:bg-stone-800 transition-colors text-xl font-bold cursor-pointer"
                    onclick="closeLogoutModal()"
                >
                    &times;
                </button>

                <!-- Icon Container -->
                <div class="w-14 h-14 mx-auto mb-4 rounded-2xl bg-rose-950/40 border border-rose-900/50 flex items-center justify-center text-rose-400 shadow-inner">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                    </svg>
                </div>

                <h2 class="text-2xl font-black text-stone-100 tracking-tight mb-1">
                    Sign Out
                </h2>
                <p class="text-xs sm:text-sm text-stone-400 font-medium mb-6">
                    Are you sure you want to end your current session?
                </p>

                <div class="flex flex-col sm:flex-row justify-end gap-2.5 pt-4 border-t border-stone-800">
                    <button
                        type="button"
                        onclick="closeLogoutModal()"
                        class="w-full sm:w-1/2 text-xs font-bold px-4 py-2.5 rounded-xl border border-stone-700 text-stone-300 hover:bg-stone-800 hover:text-stone-100 transition-colors cursor-pointer"
                    >
                        Cancel
                    </button>

                    <form method="POST" action="{% url 'logout' %}" class="w-full sm:w-1/2">
                        {% csrf_token %}
                        <button
                            type="submit"
                            class="w-full text-xs font-bold px-5 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white shadow-md transition-all cursor-pointer active:scale-95"
                        >
                            Yes, Logout
                        </button>
                    </form>
                </div>
            </div>
        </div>
