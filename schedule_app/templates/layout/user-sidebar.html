<!-- User Sidebar Container -->
<div class="relative z-50">
    <!-- Mobile Backdrop Overlay -->
    <div x-show="sidebarOpen" 
         x-transition:enter="transition-opacity ease-linear duration-300"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition-opacity ease-linear duration-300"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         @click="sidebarOpen = false"
         x-cloak
         class="fixed inset-0 bg-gray-900/20 dark:bg-gray-900/60 backdrop-blur-sm lg:hidden z-40"></div>

    <!-- User Sidebar -->
    <aside 
        @mouseenter="sidebarHover = true"
        @mouseleave="sidebarHover = false"
        :class="[sidebarOpen ? 'translate-x-0' : '-translate-x-full', (sidebarCollapsed && !sidebarHover) ? 'w-[72px]' : 'w-64']" 
        class="fixed inset-y-0 left-0 z-50 bg-gray-50 dark:bg-gray-900 border-r border-emerald-600/30 dark:border-gray-800 transform transition-all duration-300 ease-in-out lg:translate-x-0 lg:static lg:inset-0 shadow-xl shadow-gray-900/5 flex flex-col overflow-hidden">
        
        <!-- Sidebar Header -->
        <div class="h-20 flex items-center justify-center transition-colors duration-300" :class="(sidebarCollapsed && !sidebarHover) ? 'px-0' : 'px-6 justify-between'">
            <div class="flex items-center gap-3 w-full" :class="(sidebarCollapsed && !sidebarHover) ? 'justify-center' : ''">
                <div class="w-8 h-8 rounded-full border-2 border-emerald-500 bg-emerald-600 flex-shrink-0 flex items-center justify-center">
                    <span class="text-white font-bold text-sm">V</span>
                </div>
                <span x-show="(!sidebarCollapsed || sidebarHover)" 
                      x-transition:enter="transition ease-out duration-200"
                      x-transition:enter-start="opacity-0 translate-x-2"
                      x-transition:enter-end="opacity-100 translate-x-0"
                      class="text-lg font-black text-gray-900 dark:text-gray-100 whitespace-nowrap">WOFFOC VMS</span>
            </div>
            <button x-show="(!sidebarCollapsed || sidebarHover)" @click="sidebarOpen = false" class="lg:hidden text-gray-900 dark:text-gray-400 hover:text-emerald-600 transition-colors p-2 shrink-0">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>

        <!-- Navigation Links -->
        <nav class="flex-1 p-4 space-y-1.5 overflow-y-auto max-h-[calc(100vh-80px)] pb-20 overflow-x-hidden">
            <!-- ACTIVE LINK -->
            <a href="{% url 'user_dashboard' %}" class="flex items-center gap-3 px-3 py-3 rounded-xl bg-emerald-600 text-white font-bold shadow-md shadow-emerald-600/30 transition-all duration-200 relative group" :class="(sidebarCollapsed && !sidebarHover) ? 'justify-center' : ''" title="Home Feed">
                <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                <span x-show="(!sidebarCollapsed || sidebarHover)" class="whitespace-nowrap transition-opacity duration-200">Home Feed</span>
            </a>
            
            <a href="#" class="flex items-center gap-3 px-3 py-3 rounded-xl text-gray-600 dark:text-gray-400 font-bold hover:text-emerald-700 dark:hover:text-emerald-400 hover:bg-emerald-50 dark:hover:bg-emerald-900/20 hover:shadow-sm transition-all duration-200 relative group" :class="(sidebarCollapsed && !sidebarHover) ? 'justify-center' : ''" title="My Schedule">
                <svg class="w-5 h-5 shrink-0 text-gray-400 dark:text-gray-500 group-hover:text-emerald-600 dark:group-hover:text-emerald-400 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                <span x-show="(!sidebarCollapsed || sidebarHover)" class="whitespace-nowrap transition-opacity duration-200">My Schedule</span>
            </a>
            
            <a href="#" class="flex items-center gap-3 px-3 py-3 rounded-xl text-gray-600 dark:text-gray-400 font-bold hover:text-emerald-700 dark:hover:text-emerald-400 hover:bg-emerald-50 dark:hover:bg-emerald-900/20 hover:shadow-sm transition-all duration-200 relative group" :class="(sidebarCollapsed && !sidebarHover) ? 'justify-center' : ''" title="My Profile">
                <svg class="w-5 h-5 shrink-0 text-gray-400 dark:text-gray-500 group-hover:text-emerald-600 dark:group-hover:text-emerald-400 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                <span x-show="(!sidebarCollapsed || sidebarHover)" class="whitespace-nowrap transition-opacity duration-200">My Profile</span>
            </a>
        </nav>
    </aside>
</div>
