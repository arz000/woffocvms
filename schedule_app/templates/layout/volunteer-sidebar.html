<!-- Volunteer Sidebar Container -->
<div class="relative z-50 flex-shrink-0 h-full flex flex-col">
    <!-- Mobile Backdrop Overlay -->
    <div x-show="sidebarOpen" 
         x-transition:enter="transition-opacity ease-linear duration-300"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition-opacity ease-linear duration-300"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         @click="sidebarOpen = false"
         x-cloak
         class="fixed inset-0 bg-gray-900/20 dark:bg-gray-900/60 backdrop-blur-sm lg:hidden z-40"></div>

    <!-- Volunteer Sidebar -->
    <aside 
        @mouseenter="sidebarHover = true"
        @mouseleave="sidebarHover = false"
        :class="[sidebarOpen ? 'translate-x-0' : '-translate-x-full', (sidebarCollapsed && !sidebarHover) ? 'w-[72px]' : 'w-64']" 
        class="fixed inset-y-0 left-0 z-50 bg-emerald-900 dark:bg-emerald-950 text-white border-r border-emerald-800/50 dark:border-emerald-900 transform transition-all duration-300 ease-in-out lg:translate-x-0 lg:static lg:inset-0 shadow-2xl flex flex-col h-full flex-1 overflow-hidden">
        
        <!-- Sidebar Header -->
        <div class="h-20 flex items-center justify-center border-b border-emerald-800/40 transition-colors duration-300" :class="(sidebarCollapsed && !sidebarHover) ? 'px-0' : 'px-6 justify-between'">
            <div class="flex items-center gap-3 w-full" :class="(sidebarCollapsed && !sidebarHover) ? 'justify-center' : ''">
                <div class="w-9 h-9 rounded-2xl border-2 border-emerald-400 bg-emerald-700 flex-shrink-0 flex items-center justify-center shadow-md shadow-emerald-950/30">
                    <span class="text-white font-black text-sm">V</span>
                </div>
                <span x-show="(!sidebarCollapsed || sidebarHover)" 
                      x-transition:enter="transition ease-out duration-200"
                      x-transition:enter-start="opacity-0 translate-x-2"
                      x-transition:enter-end="opacity-100 translate-x-0"
                      class="text-lg font-black text-white tracking-tight whitespace-nowrap">WOFFOC VMS</span>
            </div>
            <button x-show="(!sidebarCollapsed || sidebarHover)" @click="sidebarOpen = false" class="lg:hidden text-emerald-200 hover:text-white transition-colors p-2 shrink-0">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>

        {% with url_name=request.resolver_match.url_name %}
        <!-- Navigation Links -->
        <nav class="flex-1 p-4 space-y-1.5 overflow-y-auto max-h-[calc(100vh-80px)] pb-20 overflow-x-hidden custom-scrollbar">
            <!-- Dashboard / Home Feed -->
            <a href="{% url 'user_dashboard' %}" class="flex items-center gap-3 px-3 py-3 rounded-2xl font-bold transition-all duration-200 relative group {% if url_name == 'user_dashboard' %}bg-white text-emerald-950 shadow-lg shadow-emerald-950/20 font-black{% else %}text-emerald-100 hover:text-white hover:bg-white/10{% endif %}" :class="(sidebarCollapsed && !sidebarHover) ? 'justify-center' : ''" title="Dashboard">
                <svg class="w-5 h-5 shrink-0 {% if url_name != 'user_dashboard' %}text-emerald-300 group-hover:text-white transition-colors{% endif %}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                </svg>
                <span x-show="(!sidebarCollapsed || sidebarHover)" class="whitespace-nowrap transition-opacity duration-200">Dashboard</span>
            </a>
            
            <!-- Calendar -->
            <a href="{% url 'volunteer_calendar' %}" class="flex items-center gap-3 px-3 py-3 rounded-2xl font-bold transition-all duration-200 relative group {% if url_name == 'volunteer_calendar' %}bg-white text-emerald-950 shadow-lg shadow-emerald-950/20 font-black{% else %}text-emerald-100 hover:text-white hover:bg-white/10{% endif %}" :class="(sidebarCollapsed && !sidebarHover) ? 'justify-center' : ''" title="Calendar">
                <svg class="w-5 h-5 shrink-0 {% if url_name != 'volunteer_calendar' %}text-emerald-300 group-hover:text-white transition-colors{% endif %}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                </svg>
                <span x-show="(!sidebarCollapsed || sidebarHover)" class="whitespace-nowrap transition-opacity duration-200">Calendar</span>
            </a>

            <!-- Schedule (Blackout / Unavailable Dates & Commitments) -->
            <a href="{% url 'volunteer_schedule' %}" class="flex items-center gap-3 px-3 py-3 rounded-2xl font-bold transition-all duration-200 relative group {% if url_name == 'volunteer_schedule' %}bg-white text-emerald-950 shadow-lg shadow-emerald-950/20 font-black{% else %}text-emerald-100 hover:text-white hover:bg-white/10{% endif %}" :class="(sidebarCollapsed && !sidebarHover) ? 'justify-center' : ''" title="Schedule">
                <svg class="w-5 h-5 shrink-0 {% if url_name != 'volunteer_schedule' %}text-emerald-300 group-hover:text-white transition-colors{% endif %}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <span x-show="(!sidebarCollapsed || sidebarHover)" class="whitespace-nowrap transition-opacity duration-200">Schedule</span>
            </a>

            <!-- Department Member -->
            <a href="{% url 'admin_members' %}" class="flex items-center gap-3 px-3 py-3 rounded-2xl font-bold transition-all duration-200 relative group {% if url_name == 'admin_members' %}bg-white text-emerald-950 shadow-lg shadow-emerald-950/20 font-black{% else %}text-emerald-100 hover:text-white hover:bg-white/10{% endif %}" :class="(sidebarCollapsed && !sidebarHover) ? 'justify-center' : ''" title="Department Member">
                <svg class="w-5 h-5 shrink-0 {% if url_name != 'admin_members' %}text-emerald-300 group-hover:text-white transition-colors{% endif %}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
                </svg>
                <span x-show="(!sidebarCollapsed || sidebarHover)" class="whitespace-nowrap transition-opacity duration-200">Department Member</span>
            </a>
        </nav>
        {% endwith %}
    </aside>
</div>
