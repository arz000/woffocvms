<header class="h-20 bg-gray-50/80 dark:bg-gray-950/80 backdrop-blur-md flex items-center justify-between px-6 sticky top-0 z-40 transition-colors duration-300">
    <div class="flex items-center">
        <button @click="window.innerWidth >= 1024 ? sidebarCollapsed = !sidebarCollapsed : sidebarOpen = !sidebarOpen" class="p-1 text-gray-900 dark:text-gray-100 hover:text-emerald-600 dark:hover:text-emerald-500 transition-colors">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
        <h1 style="margin-left: 1.25rem;" class="text-2xl font-black text-gray-900 dark:text-white tracking-tight transition-colors duration-300 leading-none pt-1">{{ page_title|default:"Dashboard" }}</h1>
    </div>
    
    <div class="flex items-center gap-4">
        <!-- Dark Mode Toggle -->
        <button @click="toggleDarkMode()" class="w-10 h-10 rounded-full bg-white dark:bg-gray-800 flex items-center justify-center text-gray-900 dark:text-emerald-400 shadow-sm hover:shadow-md transition-all active:scale-95 border border-gray-200 dark:border-gray-700">
            <svg x-show="!darkMode" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
            <svg x-show="darkMode" x-cloak class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
        </button>
    
        <a href="#" class="w-10 h-10 rounded-full bg-white dark:bg-gray-800 flex items-center justify-center text-gray-900 dark:text-gray-100 shadow-sm hover:shadow-md transition-all active:scale-95 border border-gray-200 dark:border-gray-700 relative">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
            <!-- Notification Badge -->
            <span class="absolute top-0 right-0 block h-2.5 w-2.5 rounded-full bg-emerald-600 ring-2 ring-white dark:ring-gray-950"></span>
        </a>
        
        <!-- Profile Dropdown -->
        <div x-data="{ profileOpen: false }" class="relative">
            <button @click="profileOpen = !profileOpen" @click.away="profileOpen = false" class="w-10 h-10 rounded-full border-2 border-emerald-500 bg-emerald-600 flex items-center justify-center cursor-pointer hover:scale-105 transition-transform">
                <span class="text-white font-bold text-sm">{{ request.user.username|make_list|first|default:'U'|upper }}</span>
            </button>
            
            <div x-show="profileOpen" 
                 x-transition:enter="transition ease-out duration-100"
                 x-transition:enter-start="transform opacity-0 scale-95"
                 x-transition:enter-end="transform opacity-100 scale-100"
                 x-transition:leave="transition ease-in duration-75"
                 x-transition:leave-start="transform opacity-100 scale-100"
                 x-transition:leave-end="transform opacity-0 scale-95"
                 x-cloak
                 class="absolute right-0 mt-3 w-48 bg-white dark:bg-gray-800 rounded-xl shadow-[0_10px_40px_rgba(0,0,0,0.1)] border border-gray-100 dark:border-gray-700 py-2 z-50">
                <div class="px-4 py-2 border-b border-gray-100 dark:border-gray-700 mb-1">
                    <p class="text-sm font-bold text-gray-900 dark:text-white">{{ request.user.get_full_name|default:request.user.username }}</p>
                    <p class="text-xs font-medium text-gray-500 dark:text-gray-400 truncate">{{ request.user.email }}</p>
                </div>
                <a href="{% url 'user_profile' %}" class="flex items-center gap-2 px-4 py-2 text-sm text-gray-700 dark:text-gray-300 font-bold hover:bg-gray-50 dark:hover:bg-gray-700/50 hover:text-emerald-600 dark:hover:text-emerald-400 transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    My Profile
                </a>
                <a href="{% url 'logout' %}" class="flex items-center gap-2 px-4 py-2 text-sm text-red-600 dark:text-red-400 font-bold hover:bg-red-50 dark:hover:bg-red-900/30 transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                    Log out
                </a>
            </div>
        </div>
    </div>
</header>
