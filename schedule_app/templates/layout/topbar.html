<header class="h-20 shrink-0 bg-emerald-600 dark:bg-emerald-900 text-white shadow-md shadow-emerald-900/15 flex items-center justify-between px-6 sticky top-0 z-40 transition-colors duration-300">
    <div class="flex items-center">
        <!-- Sidebar Toggle Button -->
        <button @click="window.innerWidth >= 1024 ? sidebarCollapsed = !sidebarCollapsed : sidebarOpen = !sidebarOpen" 
                class="p-2.5 rounded-xl text-white hover:bg-white/15 active:scale-95 transition-all cursor-pointer" 
                title="Toggle Sidebar">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
    </div>
    
    <div class="flex items-center gap-3 sm:gap-4">
        <!-- Dark Mode Toggle -->
        <button @click="toggleDarkMode()" 
                class="w-10 h-10 rounded-2xl bg-white/15 hover:bg-white/25 text-white border border-white/20 flex items-center justify-center shadow-xs transition-all active:scale-95 cursor-pointer" 
                title="Toggle Dark Mode">
            <svg x-show="!darkMode" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
            <svg x-show="darkMode" x-cloak class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
        </button>
    
        <!-- Notifications -->
        <a href="#" 
           class="w-10 h-10 rounded-2xl bg-white/15 hover:bg-white/25 text-white border border-white/20 flex items-center justify-center shadow-xs transition-all active:scale-95 relative" 
           title="Notifications">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
            <span class="absolute top-1 right-1 block h-2.5 w-2.5 rounded-full bg-amber-400 ring-2 ring-emerald-600 dark:ring-emerald-900"></span>
        </a>
        
        <!-- Profile Dropdown -->
        <div x-data="{ profileOpen: false }" class="relative">
            <button @click="profileOpen = !profileOpen" 
                    @click.away="profileOpen = false" 
                    class="w-10 h-10 rounded-2xl border-2 border-white/70 bg-white/20 flex items-center justify-center cursor-pointer hover:scale-105 active:scale-95 transition-transform shadow-xs">
                <span class="text-white font-black text-sm">{{ request.user.username|make_list|first|default:'U'|upper }}</span>
            </button>
            
            <div x-show="profileOpen" 
                 x-transition:enter="transition ease-out duration-100"
                 x-transition:enter-start="transform opacity-0 scale-95"
                 x-transition:enter-end="transform opacity-100 scale-100"
                 x-transition:leave="transition ease-in duration-75"
                 x-transition:leave-start="transform opacity-100 scale-100"
                 x-transition:leave-end="transform opacity-0 scale-95"
                 x-cloak
                 class="absolute right-0 mt-3 w-52 bg-white dark:bg-gray-900 rounded-2xl shadow-2xl border border-gray-100 dark:border-gray-800 py-2 z-50 text-gray-900 dark:text-white">
                <div class="px-4 py-2.5 border-b border-gray-100 dark:border-gray-800 mb-1">
                    <p class="text-sm font-bold text-gray-900 dark:text-white">{{ request.user.get_full_name|default:request.user.username }}</p>
                    <p class="text-xs font-medium text-gray-500 dark:text-gray-400 truncate">{{ request.user.email|default:"No email set" }}</p>
                </div>
                <a href="{% url 'user_profile' %}" class="flex items-center gap-2.5 px-4 py-2 text-xs font-bold text-gray-700 dark:text-gray-300 hover:bg-emerald-50 dark:hover:bg-emerald-950/40 hover:text-emerald-700 dark:hover:text-emerald-300 transition-colors">
                    <svg class="w-4 h-4 text-emerald-600 dark:text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    My Profile
                </a>
                <a href="{% url 'logout' %}" class="flex items-center gap-2.5 px-4 py-2 text-xs font-bold text-gray-500 hover:bg-gray-50 dark:hover:bg-gray-800 hover:text-gray-900 dark:hover:text-white transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                    Log out
                </a>
            </div>
        </div>
    </div>
</header>
