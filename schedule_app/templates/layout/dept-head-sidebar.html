<!-- Department Head Sidebar Container -->
<div class="relative z-50">
    <!-- Mobile Backdrop Overlay -->
    <div x-show="sidebarOpen" 
         x-transition:enter="transition-opacity ease-linear duration-300"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition-opacity ease-linear duration-300"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         @click="sidebarOpen = false"
         x-cloak
         class="fixed inset-0 bg-gray-900/20 dark:bg-gray-900/60 backdrop-blur-sm lg:hidden z-40"></div>

    <!-- Dept Head Sidebar -->
    <aside 
        @mouseenter="sidebarHover = true"
        @mouseleave="sidebarHover = false"
        :class="[sidebarOpen ? 'translate-x-0' : '-translate-x-full', (sidebarCollapsed && !sidebarHover) ? 'w-[72px]' : 'w-64']" 
        class="fixed inset-y-0 left-0 z-50 bg-gray-50 dark:bg-gray-900 border-r border-emerald-600/30 dark:border-gray-800 transform transition-all duration-300 ease-in-out lg:translate-x-0 lg:static lg:inset-0 shadow-xl shadow-gray-900/5 flex flex-col overflow-hidden">
        
        <!-- Sidebar Header -->
        <div class="h-20 flex items-center justify-center transition-colors duration-300" :class="(sidebarCollapsed && !sidebarHover) ? 'px-0' : 'px-6 justify-between'">
            <div class="flex items-center gap-3 w-full" :class="(sidebarCollapsed && !sidebarHover) ? 'justify-center' : ''">
                <div class="w-8 h-8 rounded-full border-2 border-emerald-500 bg-emerald-600 flex-shrink-0 flex items-center justify-center">
                    <span class="text-white font-bold text-sm">H</span>
                </div>
                <span x-show="(!sidebarCollapsed || sidebarHover)" 
                      x-transition:enter="transition ease-out duration-200"
                      x-transition:enter-start="opacity-0 translate-x-2"
                      x-transition:enter-end="opacity-100 translate-x-0"
                      class="text-lg font-black text-gray-900 dark:text-gray-100 whitespace-nowrap">WOFFOC VMS</span>
            </div>
            <button x-show="(!sidebarCollapsed || sidebarHover)" @click="sidebarOpen = false" class="lg:hidden text-gray-900 dark:text-gray-400 hover:text-emerald-600 transition-colors p-2 shrink-0">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>

        {% with url_name=request.resolver_match.url_name %}
        <!-- Navigation Links -->
        <nav class="flex-1 p-4 space-y-1.5 overflow-y-auto max-h-[calc(100vh-80px)] pb-20 overflow-x-hidden">
            <!-- ACTIVE LINK -->
            <a href="{% url 'user_dashboard' %}" class="flex items-center gap-3 px-3 py-3 rounded-xl font-bold transition-all duration-200 relative group {% if url_name == 'user_dashboard' %}bg-emerald-600 text-white shadow-md shadow-emerald-600/30{% else %}text-gray-600 dark:text-gray-400 hover:text-emerald-700 dark:hover:text-emerald-400 hover:bg-emerald-50 dark:hover:bg-emerald-900/20 hover:shadow-sm{% endif %}" :class="(sidebarCollapsed && !sidebarHover) ? 'justify-center' : ''" title="Dashboard">
                <svg class="w-5 h-5 shrink-0 {% if url_name != 'user_dashboard' %}text-gray-400 dark:text-gray-500 group-hover:text-emerald-600 dark:group-hover:text-emerald-400 transition-colors{% endif %}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                <span x-show="(!sidebarCollapsed || sidebarHover)" class="whitespace-nowrap transition-opacity duration-200">Dashboard</span>
            </a>
            
            <!-- Department Tools -->
            <div class="pt-4 pb-1">
                <p x-show="(!sidebarCollapsed || sidebarHover)" class="px-4 text-xs font-bold tracking-wider text-gray-400 uppercase whitespace-nowrap transition-opacity duration-200">Department</p>
                <div x-show="(sidebarCollapsed && !sidebarHover)" class="mx-auto w-4 border-t border-gray-300 dark:border-gray-700"></div>
            </div>
            
            <a href="{% url 'admin_schedule' %}" class="flex items-center gap-3 px-3 py-3 rounded-xl font-bold transition-all duration-200 relative group {% if url_name == 'admin_schedule' %}bg-emerald-600 text-white shadow-md shadow-emerald-600/30{% else %}text-gray-600 dark:text-gray-400 hover:text-emerald-700 dark:hover:text-emerald-400 hover:bg-emerald-50 dark:hover:bg-emerald-900/20 hover:shadow-sm{% endif %}" :class="(sidebarCollapsed && !sidebarHover) ? 'justify-center' : ''">
                <svg class="w-5 h-5 shrink-0 {% if url_name != 'admin_schedule' %}text-gray-400 dark:text-gray-500 group-hover:text-emerald-600 dark:group-hover:text-emerald-400 transition-colors{% endif %}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                <span x-show="(!sidebarCollapsed || sidebarHover)" class="whitespace-nowrap transition-opacity duration-200">Schedule</span>
            </a>

            <a href="{% url 'admin_members' %}" class="flex items-center gap-3 px-3 py-3 rounded-xl font-bold transition-all duration-200 relative group {% if url_name == 'admin_members' %}bg-emerald-600 text-white shadow-md shadow-emerald-600/30{% else %}text-gray-600 dark:text-gray-400 hover:text-emerald-700 dark:hover:text-emerald-400 hover:bg-emerald-50 dark:hover:bg-emerald-900/20 hover:shadow-sm{% endif %}" :class="(sidebarCollapsed && !sidebarHover) ? 'justify-center' : ''">
                <svg class="w-5 h-5 shrink-0 {% if url_name != 'admin_members' %}text-gray-400 dark:text-gray-500 group-hover:text-emerald-600 dark:group-hover:text-emerald-400 transition-colors{% endif %}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                <span x-show="(!sidebarCollapsed || sidebarHover)" class="whitespace-nowrap transition-opacity duration-200">Department Members</span>
            </a>

            <a href="{% url 'dept_head_events' %}" class="flex items-center gap-3 px-3 py-3 rounded-xl font-bold transition-all duration-200 relative group {% if url_name == 'dept_head_events' or url_name == 'dept_head_event_detail' %}bg-emerald-600 text-white shadow-md shadow-emerald-600/30{% else %}text-gray-600 dark:text-gray-400 hover:text-emerald-700 dark:hover:text-emerald-400 hover:bg-emerald-50 dark:hover:bg-emerald-900/20 hover:shadow-sm{% endif %}" :class="(sidebarCollapsed && !sidebarHover) ? 'justify-center' : ''" title="Service / Events">
                <svg class="w-5 h-5 shrink-0 {% if url_name != 'dept_head_events' and url_name != 'dept_head_event_detail' %}text-gray-400 dark:text-gray-500 group-hover:text-emerald-600 dark:group-hover:text-emerald-400 transition-colors{% endif %}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
                <span x-show="(!sidebarCollapsed || sidebarHover)" class="whitespace-nowrap transition-opacity duration-200">Service / Events</span>
            </a>

            <!-- Communication Section -->
            <div class="pt-4 pb-1">
                <p x-show="(!sidebarCollapsed || sidebarHover)" class="px-4 text-xs font-bold tracking-wider text-gray-400 uppercase whitespace-nowrap transition-opacity duration-200">Communication</p>
                <div x-show="(sidebarCollapsed && !sidebarHover)" class="mx-auto w-4 border-t border-gray-300 dark:border-gray-700"></div>
            </div>

            <a href="#" class="flex items-center gap-3 px-3 py-3 rounded-xl text-gray-600 dark:text-gray-400 font-bold hover:text-emerald-700 dark:hover:text-emerald-400 hover:bg-emerald-50 dark:hover:bg-emerald-900/20 hover:shadow-sm transition-all duration-200 relative group" :class="(sidebarCollapsed && !sidebarHover) ? 'justify-center' : ''" title="Announcements">
                <svg class="w-5 h-5 shrink-0 text-gray-400 dark:text-gray-500 group-hover:text-emerald-600 dark:group-hover:text-emerald-400 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z"></path></svg>
                <span x-show="(!sidebarCollapsed || sidebarHover)" class="whitespace-nowrap transition-opacity duration-200">Announcements</span>
                <span x-show="(!sidebarCollapsed || sidebarHover)" class="ml-auto bg-amber-100 dark:bg-amber-900/30 text-amber-600 dark:text-amber-400 text-[9px] font-bold px-1.5 py-0.5 rounded-md uppercase">Soon</span>
            </a>
        </nav>
        {% endwith %}
    </aside>
</div>
