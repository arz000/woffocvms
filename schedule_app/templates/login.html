{% extends 'master.html' %}

{% block content %}
<!-- Main Container using Soft Sage Green Background -->
<div class="min-h-screen py-12 px-4 sm:px-6 lg:px-8 bg-emerald-950/10 text-stone-800 antialiased flex items-center justify-center">
    
    <!-- Login Card Container -->
    <div class="w-full max-w-md bg-amber-50/70 border border-stone-200/90 rounded-3xl shadow-xl backdrop-blur-sm overflow-hidden">
        
        <!-- Top Accent Banner -->
        <div class="h-2 bg-gradient-to-r from-amber-900 via-amber-800 to-amber-900"></div>
        
        <!-- Card Body -->
        <div class="p-8 sm:p-10">
            <!-- Header -->
            <div class="text-center mb-8">
                <span class="inline-block text-[10px] font-bold tracking-widest uppercase text-emerald-900 bg-emerald-200/80 border border-emerald-300/60 rounded-full px-3 py-0.5 mb-2.5">
                    Member Portal
                </span>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-stone-900 tracking-tight">Welcome Back</h1>
                <p class="text-xs sm:text-sm text-stone-500 mt-1 font-medium">Log in to your member account</p>
            </div>

            <!-- Error Notification -->
            {% if error %}
            <div class="mb-6 p-3.5 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs font-semibold text-center flex items-center justify-center gap-2 shadow-xs">
                <span>⚠️</span>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <!-- Form -->
            <form method="POST" class="space-y-4">
                {% csrf_token %}
                
                <!-- Floating Input: Username -->
                <div class="relative">
                    <input type="text" 
                           name="username" 
                           id="id_username" 
                           placeholder=" "
                           required
                           class="peer w-full px-4 pt-6 pb-2 border border-stone-300 rounded-xl text-sm text-stone-900 bg-white/90 focus:outline-none focus:border-amber-800 focus:ring-1 focus:ring-amber-800 transition-all placeholder-transparent shadow-xs">
                    <label for="id_username" 
                           class="absolute left-4 top-2 text-[11px] font-bold text-stone-500 uppercase tracking-wider transition-all peer-placeholder-shown:text-xs peer-placeholder-shown:normal-case peer-placeholder-shown:tracking-normal peer-placeholder-shown:text-stone-400 peer-placeholder-shown:top-3.5 peer-focus:top-2 peer-focus:text-[11px] peer-focus:font-bold peer-focus:uppercase peer-focus:tracking-wider peer-focus:text-amber-900 pointer-events-none">
                        Username
                    </label>
                </div>

                <!-- Floating Input: Password -->
                <div class="relative">
                    <input type="password" 
                           name="password" 
                           id="id_password" 
                           placeholder=" "
                           required
                           class="peer w-full px-4 pt-6 pb-2 border border-stone-300 rounded-xl text-sm text-stone-900 bg-white/90 focus:outline-none focus:border-amber-800 focus:ring-1 focus:ring-amber-800 transition-all placeholder-transparent shadow-xs">
                    <label for="id_password" 
                           class="absolute left-4 top-2 text-[11px] font-bold text-stone-500 uppercase tracking-wider transition-all peer-placeholder-shown:text-xs peer-placeholder-shown:normal-case peer-placeholder-shown:tracking-normal peer-placeholder-shown:text-stone-400 peer-placeholder-shown:top-3.5 peer-focus:top-2 peer-focus:text-[11px] peer-focus:font-bold peer-focus:uppercase peer-focus:tracking-wider peer-focus:text-amber-900 pointer-events-none">
                        Password
                    </label>
                </div>

                <!-- Submit Button -->
                <button type="submit" 
                        class="w-full mt-2 bg-amber-900 hover:bg-amber-950 text-amber-50 text-xs sm:text-sm font-semibold py-3.5 rounded-xl shadow-sm hover:shadow transition-all duration-150 active:scale-[0.98] cursor-pointer">
                    Login
                </button>
            </form>

            <!-- Footer -->
            <p class="text-xs text-center text-stone-500 mt-8 font-medium">
                New here? 
                <a href="{% url 'register' %}" class="text-amber-900 font-bold hover:underline ml-0.5">Create an account</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
