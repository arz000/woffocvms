<!-- Manage Capabilities Modal -->
<div x-show="capabilitiesModalOpen" 
     x-transition:enter="transition ease-out duration-300"
     x-transition:enter-start="opacity-0"
     x-transition:enter-end="opacity-100"
     x-transition:leave="transition ease-in duration-200"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0"
     class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-gray-900/60 dark:bg-gray-950/80 backdrop-blur-sm"
     x-cloak>
    
    <div @click.away="capabilitiesModalOpen = false" 
         x-show="capabilitiesModalOpen"
         x-transition:enter="transition ease-out duration-300 delay-100"
         x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
         x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100"
         x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
         class="bg-white dark:bg-gray-900 rounded-3xl shadow-2xl w-full max-w-2xl overflow-hidden border border-gray-100 dark:border-gray-800 flex flex-col max-h-[90vh]">
        
        <!-- Modal Header -->
        <div class="px-6 py-5 border-b border-gray-100 dark:border-gray-800 flex items-center justify-between sticky top-0 bg-white dark:bg-gray-900 z-10">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-indigo-50 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400 flex items-center justify-center border border-indigo-100 dark:border-indigo-800/50">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path></svg>
                </div>
                <div>
                    <h3 class="text-xl font-black text-gray-900 dark:text-white tracking-tight">System Capabilities</h3>
                    <p class="text-xs font-medium text-gray-500">Add, review, and remove granular system permissions.</p>
                </div>
            </div>
            <button @click="capabilitiesModalOpen = false" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 transition-colors p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        
        <!-- Modal Body -->
        <div class="p-6 overflow-y-auto flex-1 space-y-6 custom-scrollbar">
            
            <!-- Create New Capability Form Card -->
            <div class="bg-gray-50 dark:bg-gray-950 p-4 sm:p-5 rounded-2xl border border-gray-100 dark:border-gray-800 space-y-4">
                <h4 class="text-xs font-bold uppercase tracking-wider text-gray-700 dark:text-gray-300 flex items-center gap-1.5">
                    <svg class="w-4 h-4 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    Create New Capability
                </h4>
                
                <form @submit.prevent="
                    if (!newCapName.trim()) return;
                    isSubmittingCap = true;
                    fetch('/api/create-capability/', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': '{{ csrf_token }}'
                        },
                        body: JSON.stringify({
                            name: newCapName.trim(),
                            description: newCapDesc.trim()
                        })
                    })
                    .then(res => res.json())
                    .then(data => {
                        isSubmittingCap = false;
                        if (data.success) {
                            allCapabilities.push(data.capability);
                            newCapName = '';
                            newCapDesc = '';
                            if (window.showToast) window.showToast('Capability created successfully!', 'success');
                        } else {
                            if (window.showToast) window.showToast(data.error || 'Failed to create capability', 'error');
                        }
                    })
                    .catch(err => {
                        isSubmittingCap = false;
                        if (window.showToast) window.showToast('Network error while creating capability', 'error');
                    });
                " class="space-y-3">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 dark:text-gray-400 mb-1">Capability Name <span class="text-red-500">*</span></label>
                        <input type="text" 
                               x-model="newCapName" 
                               placeholder="e.g. Export Reports, Broadcast Announcements..." 
                               required 
                               class="w-full px-3.5 py-2.5 bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-xl text-xs sm:text-sm font-semibold text-gray-900 dark:text-white focus:outline-hidden focus:ring-2 focus:ring-emerald-500 transition-all placeholder:text-gray-400">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 dark:text-gray-400 mb-1">Description <span class="text-gray-400 font-normal">(Optional)</span></label>
                        <input type="text" 
                               x-model="newCapDesc" 
                               placeholder="e.g. Can export service records and member rosters to Excel..." 
                               class="w-full px-3.5 py-2.5 bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-xl text-xs sm:text-sm font-medium text-gray-900 dark:text-white focus:outline-hidden focus:ring-2 focus:ring-emerald-500 transition-all placeholder:text-gray-400">
                    </div>
                    <div class="flex justify-end pt-1">
                        <button type="submit" 
                                :disabled="isSubmittingCap || !newCapName.trim()"
                                class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 disabled:opacity-50 text-white rounded-xl text-xs font-bold shadow-md shadow-emerald-600/20 transition-all active:scale-95 flex items-center gap-1.5 cursor-pointer">
                            <svg x-show="!isSubmittingCap" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                            <svg x-show="isSubmittingCap" class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                            <span>Add Capability</span>
                        </button>
                    </div>
                </form>
            </div>

            <!-- Existing Capabilities List -->
            <div class="space-y-3">
                <div class="flex items-center justify-between gap-3">
                    <h4 class="text-xs font-bold uppercase tracking-wider text-gray-700 dark:text-gray-300 flex items-center gap-1.5">
                        <span>All Capabilities</span>
                        <span class="bg-gray-200 dark:bg-gray-800 text-gray-700 dark:text-gray-300 text-[10px] font-black px-2 py-0.5 rounded-full" x-text="allCapabilities.length"></span>
                    </h4>
                    
                    <!-- Search Input -->
                    <div class="relative w-48 sm:w-56">
                        <input type="text" 
                               x-model="capSearchQuery" 
                               placeholder="Filter capabilities..." 
                               class="w-full bg-gray-50 dark:bg-gray-950 border border-gray-200 dark:border-gray-800 text-gray-900 dark:text-white text-xs font-medium rounded-xl pl-8 pr-3 py-1.5 focus:ring-2 focus:ring-emerald-500 focus:outline-hidden transition-all">
                        <div class="absolute inset-y-0 left-0 pl-2.5 flex items-center pointer-events-none text-gray-400">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                        </div>
                    </div>
                </div>

                <div class="space-y-2 max-h-[260px] overflow-y-auto custom-scrollbar pr-1">
                    <template x-for="cap in allCapabilities.filter(c => !capSearchQuery || c.name.toLowerCase().includes(capSearchQuery.toLowerCase().trim()) || (c.description && c.description.toLowerCase().includes(capSearchQuery.toLowerCase().trim())))" :key="cap.id">
                        <div class="flex items-center justify-between p-3.5 bg-white dark:bg-gray-950/60 rounded-2xl border border-gray-100 dark:border-gray-800 hover:border-gray-200 dark:hover:border-gray-700 transition-colors group">
                            <div class="min-w-0 pr-3">
                                <p class="text-xs sm:text-sm font-bold text-gray-900 dark:text-white" x-text="cap.name"></p>
                                <p class="text-[11px] text-gray-500 dark:text-gray-400 truncate mt-0.5" x-text="cap.description || 'No description provided.'"></p>
                            </div>
                            
                            <button type="button" 
                                    @click="
                                        if (!confirm(`Are you sure you want to delete the capability '${cap.name}'? It will be removed from all roles.`)) return;
                                        fetch('/api/delete-record/', {
                                            method: 'POST',
                                            headers: {
                                                'Content-Type': 'application/json',
                                                'X-CSRFToken': '{{ csrf_token }}'
                                            },
                                            body: JSON.stringify({
                                                model: 'Capability',
                                                id: cap.id
                                            })
                                        })
                                        .then(res => res.json())
                                        .then(data => {
                                            if (data.success) {
                                                allCapabilities = allCapabilities.filter(c => c.id !== cap.id);
                                                editRoleCapabilities = editRoleCapabilities.filter(id => id !== cap.id);
                                                if (window.showToast) window.showToast('Capability deleted successfully!', 'success');
                                            } else {
                                                if (window.showToast) window.showToast(data.error || 'Failed to delete capability', 'error');
                                            }
                                        })
                                        .catch(err => {
                                            if (window.showToast) window.showToast('Network error while deleting capability', 'error');
                                        });
                                    " 
                                    class="text-gray-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-950/40 p-2 rounded-xl transition-colors cursor-pointer shrink-0" 
                                    title="Delete capability">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        </div>
                    </template>
                </div>
            </div>

        </div>
        
        <!-- Modal Footer -->
        <div class="px-6 py-4 border-t border-gray-100 dark:border-gray-800 bg-gray-50 dark:bg-gray-950/50 flex justify-end">
            <button @click="capabilitiesModalOpen = false" class="px-5 py-2.5 rounded-xl text-xs sm:text-sm font-bold text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-800 transition-colors cursor-pointer">Done</button>
        </div>
    </div>
</div>
