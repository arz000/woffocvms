            <!-- Edit Role Modal -->
            <div x-show="editModalOpen" 
                 x-transition:enter="transition ease-out duration-300"
                 x-transition:enter-start="opacity-0"
                 x-transition:enter-end="opacity-100"
                 x-transition:leave="transition ease-in duration-200"
                 x-transition:leave-start="opacity-100"
                 x-transition:leave-end="opacity-0"
                 class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-gray-900/50 dark:bg-gray-950/80 backdrop-blur-sm"
                 x-cloak>
                
                <div @click.away="editModalOpen = false" 
                     x-show="editModalOpen"
                     x-transition:enter="transition ease-out duration-300 delay-100"
                     x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
                     x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100"
                     x-transition:leave="transition ease-in duration-200"
                     x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100"
                     x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
                     class="bg-white dark:bg-gray-900 rounded-2xl shadow-xl w-full max-w-2xl overflow-hidden border border-gray-100 dark:border-gray-800 flex flex-col max-h-[90vh]">
                    
                    <!-- Modal Header -->
                    <div class="px-6 py-5 border-b border-gray-100 dark:border-gray-800 flex items-center justify-between sticky top-0 bg-white dark:bg-gray-900 z-10">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full flex items-center justify-center"
                                 :class="{
                                     'bg-red-100 text-red-600': editRoleTheme === 'red',
                                     'bg-amber-100 text-amber-600': editRoleTheme === 'amber',
                                     'bg-blue-100 text-blue-600': editRoleTheme === 'blue',
                                     'bg-emerald-100 text-emerald-600': editRoleTheme === 'emerald'
                                 }">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                            </div>
                            <div>
                                <h3 class="text-xl font-black text-gray-900 dark:text-white" x-text="editRoleId ? 'Edit ' + editRoleName : 'Create New Role'"></h3>
                                <p class="text-sm font-medium text-gray-500">Modify role details and capabilities</p>
                            </div>
                        </div>
                        <button @click="editModalOpen = false" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 transition-colors p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                        </button>
                    </div>
                    
                    <!-- Modal Body -->
                    <div class="p-6 overflow-y-auto flex-1">
                        <div class="space-y-6">
                            <!-- Role Details -->
                            <div class="space-y-4">
                                <div>
                                    <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-1.5">Role Name</label>
                                    <input type="text" x-model="editRoleName" class="w-full px-4 py-2.5 bg-gray-50 dark:bg-gray-950 border border-gray-200 dark:border-gray-800 rounded-xl text-sm font-medium text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:border-transparent transition-all"
                                           :class="{
                                               'focus:ring-red-500/20 focus:border-red-500/50': editRoleTheme === 'red',
                                               'focus:ring-amber-500/20 focus:border-amber-500/50': editRoleTheme === 'amber',
                                               'focus:ring-blue-500/20 focus:border-blue-500/50': editRoleTheme === 'blue',
                                               'focus:ring-emerald-500/20 focus:border-emerald-500/50': editRoleTheme === 'emerald'
                                           }">
                                </div>
                                <div>
                                    <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-1.5">Description</label>
                                    <textarea x-model="editRoleDesc" rows="2" class="w-full px-4 py-2.5 bg-gray-50 dark:bg-gray-950 border border-gray-200 dark:border-gray-800 rounded-xl text-sm font-medium text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:border-transparent transition-all resize-none"
                                           :class="{
                                               'focus:ring-red-500/20 focus:border-red-500/50': editRoleTheme === 'red',
                                               'focus:ring-amber-500/20 focus:border-amber-500/50': editRoleTheme === 'amber',
                                               'focus:ring-blue-500/20 focus:border-blue-500/50': editRoleTheme === 'blue',
                                               'focus:ring-emerald-500/20 focus:border-emerald-500/50': editRoleTheme === 'emerald'
                                           }"></textarea>
                                </div>
                            </div>
                            
                            <!-- Capabilities Divider -->
                            <div class="border-t border-gray-100 dark:border-gray-800 pt-6">
                                <h4 class="text-sm font-bold text-gray-900 dark:text-white mb-4">Capabilities</h4>
                                
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    {% for cap in all_capabilities %}
                                    <!-- Capability Item -->
                                    <label class="flex items-start gap-3 p-3 rounded-xl border border-gray-100 dark:border-gray-800 cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-900/50 transition-colors">
                                        <div class="relative flex items-center pt-0.5">
                                            <input type="checkbox" :value="{{ cap.id }}" x-model="editRoleCapabilities" class="peer sr-only">
                                            <div class="w-5 h-5 rounded border border-gray-300 dark:border-gray-700 transition-colors flex items-center justify-center"
                                                 :class="{
                                                     'peer-checked:bg-red-500 peer-checked:border-red-500': editRoleTheme === 'red',
                                                     'peer-checked:bg-amber-500 peer-checked:border-amber-500': editRoleTheme === 'amber',
                                                     'peer-checked:bg-blue-500 peer-checked:border-blue-500': editRoleTheme === 'blue',
                                                     'peer-checked:bg-emerald-500 peer-checked:border-emerald-500': editRoleTheme === 'emerald'
                                                 }">
                                                <svg class="w-3 h-3 text-white opacity-0 peer-checked:opacity-100" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                                            </div>
                                        </div>
                                        <div>
                                            <p class="text-sm font-bold text-gray-900 dark:text-white leading-none mb-1">{{ cap.name }}</p>
                                            <p class="text-xs font-medium text-gray-500 leading-tight">{{ cap.description }}</p>
                                        </div>
                                    </label>
                                    {% endfor %}
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Modal Footer -->
                    <div class="px-6 py-4 border-t border-gray-100 dark:border-gray-800 bg-gray-50 dark:bg-gray-950/50 flex justify-end gap-3">
                        <button @click="editModalOpen = false" class="px-5 py-2.5 rounded-xl text-sm font-bold text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-800 transition-colors">Cancel</button>
                        <button @click="
                            fetch('/api/update-role/', {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json',
                                    'X-CSRFToken': '{{ csrf_token }}'
                                },
                                body: JSON.stringify({
                                    role_id: editRoleId,
                                    name: editRoleName,
                                    description: editRoleDesc,
                                    capabilities: editRoleCapabilities.map(Number)
                                })
                            }).then(res => res.json()).then(data => {
                                if(data.success) {
                                    window.location.reload();
                                } else {
                                    alert('Error saving role: ' + data.error);
                                }
                            }).catch(err => {
                                alert('Network error while saving');
                                console.error(err);
                            });
                        " class="px-5 py-2.5 text-white rounded-xl text-sm font-bold shadow-md transition-all active:scale-95"
                                :class="{
                                    'bg-red-600 hover:bg-red-700 shadow-red-600/20': editRoleTheme === 'red',
                                    'bg-amber-600 hover:bg-amber-700 shadow-amber-600/20': editRoleTheme === 'amber',
                                    'bg-blue-600 hover:bg-blue-700 shadow-blue-600/20': editRoleTheme === 'blue',
                                    'bg-emerald-600 hover:bg-emerald-700 shadow-emerald-600/20': editRoleTheme === 'emerald'
                                }"
                                x-text="editRoleId ? 'Save Changes' : 'Create Role'">
                        </button>
                    </div>
                </div>
            </div>
