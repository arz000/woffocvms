            <!-- Manage Access Modal -->
            <div x-show="manageModalOpen" 
                 x-transition:enter="transition ease-out duration-300"
                 x-transition:enter-start="opacity-0"
                 x-transition:enter-end="opacity-100"
                 x-transition:leave="transition ease-in duration-200"
                 x-transition:leave-start="opacity-100"
                 x-transition:leave-end="opacity-0"
                 class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-gray-900/50 dark:bg-gray-950/80 backdrop-blur-sm"
                 x-cloak>
                
                <div @click.away="manageModalOpen = false" 
                     x-show="manageModalOpen"
                     x-transition:enter="transition ease-out duration-300 delay-100"
                     x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
                     x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100"
                     x-transition:leave="transition ease-in duration-200"
                     x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100"
                     x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
                     class="bg-white dark:bg-gray-900 rounded-2xl shadow-xl w-full max-w-2xl overflow-hidden border border-gray-100 dark:border-gray-800 flex flex-col max-h-[90vh]">
                    
                    <!-- Modal Header -->
                    <div class="px-6 py-5 border-b border-gray-100 dark:border-gray-800 flex items-center justify-between sticky top-0 bg-white dark:bg-gray-900 z-10">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full flex items-center justify-center"
                                 :class="{
                                     'bg-red-100 text-red-600': roleTheme === 'red',
                                     'bg-amber-100 text-amber-600': roleTheme === 'amber',
                                     'bg-blue-100 text-blue-600': roleTheme === 'blue',
                                     'bg-emerald-100 text-emerald-600': roleTheme === 'emerald'
                                 }">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457.39-2.823 1.07-4"></path></svg>
                            </div>
                            <div>
                                <h3 class="text-xl font-black text-gray-900 dark:text-white" x-text="selectedRole + ' Access'"></h3>
                                <p class="text-sm font-medium text-gray-500">Manage users assigned to this role</p>
                            </div>
                        </div>
                        <button @click="manageModalOpen = false" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 transition-colors p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                        </button>
                    </div>
                    
                    <!-- Modal Body -->
                    <div class="p-6 overflow-y-auto flex-1">
                        <!-- Add User Section -->
                        <div class="mb-8">
                            <h4 class="text-sm font-bold text-gray-900 dark:text-white mb-3">Add User to Role</h4>
                            <div class="flex gap-3" x-data="{ searchQuery: '', searchResults: [], searchTimeout: null, selectedUserId: null }">
                                <div class="relative flex-1">
                                    <svg class="w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                                    <input type="text" x-model="searchQuery"
                                           @input="clearTimeout(searchTimeout); searchTimeout = setTimeout(async () => {
                                                if (searchQuery.length < 2) { searchResults = []; return; }
                                                const res = await fetch(`/search-volunteers/?q=${searchQuery}`);
                                                const data = await res.json();
                                                searchResults = data.results;
                                           }, 300)"
                                           placeholder="Search by name or username..." class="w-full pl-10 pr-4 py-2.5 bg-gray-50 dark:bg-gray-950 border border-gray-200 dark:border-gray-800 rounded-xl text-sm font-medium focus:outline-none focus:ring-2 focus:border-transparent transition-all"
                                           :class="{
                                               'focus:ring-red-500/20': roleTheme === 'red',
                                               'focus:ring-amber-500/20': roleTheme === 'amber',
                                               'focus:ring-blue-500/20': roleTheme === 'blue',
                                               'focus:ring-emerald-500/20': roleTheme === 'emerald'
                                           }">
                                           
                                    <!-- Autocomplete dropdown -->
                                    <div x-show="searchResults.length > 0" @click.away="searchResults = []" class="absolute z-50 w-full mt-1 bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-xl shadow-lg max-h-60 overflow-y-auto">
                                        <template x-for="res in searchResults" :key="res.id">
                                            <div @click="selectedUserId = res.id; searchQuery = res.label; searchResults = []" class="px-4 py-3 hover:bg-gray-50 dark:hover:bg-gray-800 cursor-pointer text-sm font-medium text-gray-900 dark:text-gray-100 border-b border-gray-100 dark:border-gray-800 last:border-0 transition-colors" x-text="res.label"></div>
                                        </template>
                                    </div>
                                </div>
                                <button @click="
                                    if (!selectedUserId) return;
                                    fetch('/api/assign-role/', {
                                        method: 'POST',
                                        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' },
                                        body: JSON.stringify({ role_id: selectedRoleId, user_id: selectedUserId })
                                    }).then(res => res.json()).then(data => {
                                        if (data.success) {
                                            if (!roleUsers.find(u => u.id === data.user.id)) {
                                                roleUsers.push(data.user);
                                            }
                                            searchQuery = '';
                                            selectedUserId = null;
                                        } else {
                                            alert('Error: ' + data.error);
                                        }
                                    });
                                " class="px-4 py-2.5 text-white rounded-xl text-sm font-bold shadow-md transition-all active:scale-95"
                                        :class="{
                                            'bg-red-600 hover:bg-red-700 shadow-red-600/20': roleTheme === 'red',
                                            'bg-amber-600 hover:bg-amber-700 shadow-amber-600/20': roleTheme === 'amber',
                                            'bg-blue-600 hover:bg-blue-700 shadow-blue-600/20': roleTheme === 'blue',
                                            'bg-emerald-600 hover:bg-emerald-700 shadow-emerald-600/20': roleTheme === 'emerald'
                                        }">
                                    Add User
                                </button>
                            </div>
                        </div>

                        <!-- Current Users List -->
                        <div>
                            <div class="flex justify-between items-center mb-4">
                                <h4 class="text-sm font-bold text-gray-900 dark:text-white">Current Users</h4>
                                <span class="bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400 text-xs font-bold px-2.5 py-1 rounded-full" x-text="`${roleUsers.length} Assigned`"></span>
                            </div>
                            
                            <div class="space-y-3">
                                <!-- Empty State -->
                                <div x-show="roleUsers.length === 0" class="py-12 flex flex-col items-center justify-center text-center bg-gray-50/50 dark:bg-gray-950/20 rounded-2xl border-2 border-dashed border-gray-200 dark:border-gray-800">
                                    <div class="w-12 h-12 rounded-full bg-gray-100 dark:bg-gray-800 flex items-center justify-center mb-3">
                                        <svg class="w-6 h-6 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                                    </div>
                                    <h5 class="text-sm font-bold text-gray-900 dark:text-white">No Users Assigned</h5>
                                    <p class="text-xs font-medium text-gray-500 mt-1 max-w-[200px] mx-auto">Use the search bar above to assign users to this role.</p>
                                </div>
                                
                                <!-- User List -->
                                <template x-for="user in roleUsers" :key="user.id">
                                    <div class="flex items-center justify-between p-3 bg-gray-50 dark:bg-gray-950 rounded-xl border border-gray-100 dark:border-gray-800">
                                        <div class="flex items-center gap-3">
                                            <div class="w-10 h-10 rounded-full bg-white dark:bg-gray-900 flex items-center justify-center shadow-sm text-gray-700 dark:text-gray-300 font-bold"
                                                 :class="{
                                                     'text-red-600': roleTheme === 'red',
                                                     'text-amber-600': roleTheme === 'amber',
                                                     'text-blue-600': roleTheme === 'blue',
                                                     'text-emerald-600': roleTheme === 'emerald'
                                                 }"
                                                 x-text="user.name.charAt(0).toUpperCase()">
                                            </div>
                                            <div>
                                                <p class="text-sm font-bold text-gray-900 dark:text-white" x-text="user.name"></p>
                                                <p class="text-xs font-medium text-gray-500" x-text="user.email"></p>
                                            </div>
                                        </div>
                                        <button @click="
                                            if (!confirm('Are you sure you want to remove this user from the role?')) return;
                                            fetch('/api/remove-role/', {
                                                method: 'POST',
                                                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' },
                                                body: JSON.stringify({ user_id: user.id })
                                            }).then(res => res.json()).then(data => {
                                                if (data.success) {
                                                    roleUsers = roleUsers.filter(u => u.id !== user.id);
                                                } else {
                                                    alert('Error: ' + data.error);
                                                }
                                            });
                                        " class="text-gray-400 hover:text-red-500 transition-colors p-2 rounded-lg hover:bg-red-50 dark:hover:bg-red-500/10" title="Remove User">
                                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                        </button>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Modal Footer -->
                    <div class="px-6 py-4 border-t border-gray-100 dark:border-gray-800 bg-gray-50 dark:bg-gray-950/50 flex justify-end">
                        <button @click="manageModalOpen = false" class="px-5 py-2.5 rounded-xl text-sm font-bold text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-800 transition-colors">Close</button>
                    </div>
                </div>
            </div>
